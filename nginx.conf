server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：任何路径都回退到 index.html（本站无后端 API）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带哈希的静态资源可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
